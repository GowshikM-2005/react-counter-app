name: Counter App CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}
  schedule:
    # GitHub Actions supports 5-minute granularity minimum; use this to emulate pollSCM
    - cron: "*/60 * * * *"

env:
  REGISTRY: gowshikm
  IMAGE_NAME: counter-app
  MANIFEST_REPO: GowshikM-2005/react-counter-deploy
  MANIFEST_BRANCH: main
  # v<RunNumber> to mirror Jenkins' v${BUILD_NUMBER}
  IMAGE_TAG: v${{ github.run_number }}

permissions:
  contents: write   # allow this workflow to fetch repos and write commits locally

jobs:
  build_push_update:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Check out app repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🧰 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Compute image tag & print
        id: vars
        run: |
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT
          echo "Image will be: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      - name: 🏗️ Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.IMAGE }}

      - name: 🧹 Clean any previous manifest folder
        run: rm -rf react-counter-deploy

      - name: 📥 Clone deployment/manifest repo
        run: |
          git clone --branch "${{ env.MANIFEST_BRANCH }}" \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.MANIFEST_REPO }}.git \
            react-counter-deploy

      - name: 📝 Update image tag in k8s/deployment.yml
        working-directory: react-counter-deploy
        run: |
          echo "Updating image to ${{ steps.vars.outputs.IMAGE }} in k8s/deployment.yml"
          sed -i 's|image: .*|image: '"${{ steps.vars.outputs.IMAGE }}"'|g' k8s/deployment.yml
          echo "Result:"
          grep -n 'image:' k8s/deployment.yml || true

      - name: 🧭 Configure Git identity
        working-directory: react-counter-deploy
        run: |
          git config user.name  "${{ secrets.GIT_USER_NAME  || 'github-actions[bot]' }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"

      - name: ✅ Commit if there are changes
        working-directory: react-counter-deploy
        run: |
          git add k8s/deployment.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🚀 Update image tag to ${{ env.IMAGE_TAG }} [Run #${{ github.run_number }}]"
          fi

      - name: 📤 Push updated manifest
        if: success()
        working-directory: react-counter-deploy
        run: |
          # push to the remote using PAT
          git push origin "${{ env.MANIFEST_BRANCH }}"
